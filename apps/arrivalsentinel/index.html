    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"ArrivalSentinel","category":"Productivity","desc":"ArrivalSentinel is a simple arrival reminder: when you enter a chosen radius around a destination, you’ll get a notification saying you’re almost there.…","details":"ArrivalSentinel is a simple arrival reminder: when you enter a chosen radius around a destination, you’ll get a notification saying you’re almost there.\n\nGreat for\n\nCommuting: prepare to get off or transfer\n\nPickups: remind yourself (or message someone) when you’re close\n\nErrands: prompt what to bring as you approach\n\nTrips & drives: arrive prepared, not rushed\n\nKey Features\n\nGeofence Arrival Alerts: automatic notifications when you enter the area\n\nCustom Radius: set a range for each destination\n\nHistory Log: review when and where alerts were triggered\n\nSet from History: create a new alert by reusing a past destination in one tap\n\nFast Setup: add a place → set radius → enable\n\nLow Distraction: alerts only when it matters—near the destination\n\nPrivacy\nLocation access is used only to enable arrival alerts and (optional) history logs. You can change permissions anytime in iOS Settings.","href":"https://apps.apple.com/il/app/arrivalsentinel/id6757770245?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/e9/8e/87/e98e87c2-3b4c-2878-a563-e6fea8826163/AppIcon-0-0-1x_U007emarketing-0-8-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/bc/67/19/bc671914-f8cc-4d4a-ab43-fdb748a6e4fd/ArrivalSentinel_AppStore_Promo_1242x2688_6.5in.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/bf/25/25/bf25253a-4933-dc96-ca85-ee8fce888b45/IMG_6585.PNG/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/7c/8f/1c/7c8f1ccd-b7ea-7b59-245f-0625ddaacc99/IMG_6586.PNG/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/81/3a/0f/813a0f7b-f34b-fb1e-
