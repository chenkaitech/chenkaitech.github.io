    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"BrainSprint:Focus&Memory","category":"Lifestyle","desc":"BrainSprint is your ultimate brain training app, combining classic cognitive exercises into fun, short sessions perfect for daily practice. Key Features…","details":"BrainSprint is your ultimate brain training app, combining classic cognitive exercises into fun, short sessions perfect for daily practice.\n\nKey Features:\n\n1. Home Dashboard\n- Dynamic greeting messages based on morning/afternoon/evening\n- Daily progress ring showing completed training vs. goal\n- Consecutive training days tracker\n- Overall focus score\n- Quick start button for Schulte Grid training\n- Four training type cards for easy navigation\n\n2. Training Games\n- Schulte Grid: 3×3 to 6×6 grids, visual variants (color mix, size, rotation, transparency, font styles), rule variants (ascending, descending, odd/even, skip, dual sequence), dynamic variants (click-to-disappear, reshuffle on error, flicker, relocation)\n- Stroop: color/shape/direction/size tasks, choose correct font color, word meaning, or shape/direction, supports 2- or 4-option choices, combo and rule switch modes\n- Go/No-Go: color, emoji, letter, fruit stimuli; single, double, reverse, or consecutive mode; 60-second timed sessions\n- N-Back: letters, numbers, colors, positions, shapes; 1–3 back levels; 30-trial sequences with same/different judgments\n\n3. Training Result Page\n- Animated score ring\n- Stats: duration, accuracy, average reaction time, error count\n- Highlight new records\n- Retry or continue buttons\n- Share your results\n\n4. Statistics Page\n- 7-day focus score trend chart\n- Weekly training duration\n- Today's average reaction time\n- Daily report: completed sessions, total time, best & weakest exercises\n- History list with deletion support\n\n5. Profile Page\n- Edit nickname\n- Set daily goal (1–10 sessions)\n- Enable notifications & reminders\n- Haptic & sound feedback settings\n- Clear all training data\n\nBrainSprint is perfect for students, professionals, or anyone looking to improve attention, reaction speed, and working memory through fun and challenging daily exercises.","href":"https://apps.apple.com/il/app/brainsprint-focus-memory/id6772679802?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/73/0b/19/730b19e4-eb49-9bd5-1074-ff7c13e575c7/AppIcon-0-1x_U007epad-0-1-85-220-0.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/c7/c7/6b/c7c76bdb-d38e-ec9c-b675-82bcc3433a7a/brainsprint-_U5ba3_U4f20-en.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/1c/1c/da/1c1cda97-c1f2-f728-67c5-916f8fa69b35/IMG_6805.PNG/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/fe/45/b4/fe45b431-9563-6e43-8b8c-01d3019f448c/IMG_6806.PNG/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/92/c6/00/92c60047-7b84-c5b4-e336-75356d820123/IMG_6807.PNG/320x480bb.jpg"],"slug":"brainsprint-focus-memory"};</script>
