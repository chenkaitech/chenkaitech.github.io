    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"DoneLog - Done List & Time Log","category":"Lifestyle","desc":"DoneLog is a focused done list, time log, and activity tracking app designed to help you record what you actually completed. Most task apps remind you o…","details":"DoneLog is a focused done list, time log, and activity tracking app designed to help you record what you actually completed.\n\nMost task apps remind you of what is still unfinished. DoneLog focuses on something different: what you have already done, how much time you spent, and which activities mattered most.\n\nUse DoneLog as a personal done list, time tracker, study log, work journal, daily activity tracker, or weekly review tool. Whether you are working, studying, exercising, resting, or tracking meaningful daily activities, DoneLog helps you log your progress and review your time clearly.\n\nKey Features\n\nLog Completed Activities\nQuickly record completed tasks, activities, or achievements with a title, notes, start time, and end time.\n\nTime Block Tracking\nSet start and end times for each activity. DoneLog automatically calculates the duration so you can understand where your time goes.\n\nQuick Duration Presets\nUse common presets such as 30 minutes, 1 hour, or 2 hours to log activities faster with less manual input.\n\nHigh Impact Marker\nMark important achievements as High Impact so you can easily identify key wins, milestones, and meaningful progress.\n\nTimeline View\nReview your day in a clear timeline format and see what you actually completed throughout the day.\n\nInsights and Analytics\nVisualize your time distribution, category breakdowns, and activity patterns with charts and statistics.\n\nCategories and Customization\nUse built-in categories such as Work, Study, and Rest, or create your own categories with custom names, icons, and colors.\n\nLocal Reminders\nSet reminders to help you log your current activity regularly. Choose reminder frequencies such as every 30 minutes, 1 hour, or 2 hours.\n\nCSV and PDF Export\nExport your logs as CSV files for further analysis in Excel, Numbers, or other tools. You can also generate beautiful PDF reports for review, sharing, or printing.\n\nGreat For\nDaily work logs\nStudy time tracking\nFreelance time management\nProject reviews\nPersonal productivity journaling\nHabit and activity logging\nWeekly reports\nTracking achievements and milestones\nWhy DoneLog?\n\nDoneLog is not a traditional to-do list.\nInstead of only showing what is still unfinished, DoneLog helps you see what you have already accomplished.\n\nBy recording your completed activities every day, you can better understand your time, recognize meaningful progress, and build a clear record of your work and personal growth.\n\nDoneLog helps you record what you actually did.","href":"https://apps.apple.com/il/app/donelog-done-list-time-log/id6768064779?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/42/87/ca/4287ca66-fe3f-e8c3-235d-304c71d530e7/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/89/19/4a/89194a21-b3b4-b546-f4db-287405e896bc/iphone-6.5_-_U00281242x2688_U0029_1242x2688_chatgpt-image-may-16_U002c-2026_U002c-08_33_48-am-_U00283_U0029.png.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/7d/e6/8b/7de68b28-7781-d372-261f-a8635282751c/iphone-6.5_-_U00281242x2688_U0029_1242x2688_chatgpt-image-may-16_U002c-2026_U002c-08_33_39-am-_U00282_U0029.png.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/c0/e2/7b/c0e27bb7-4cfa-baa3-ee30-c512136f37a0/iphone-6.5_-_U00281242x2688_U0029_1242x2688_chatgpt-image-may-16_U002c-2026_U002c-08_33_39-am-_U00281_U0029.png.jpg/320x480bb.jpg"],"slug":"donelog-done-list-time-log"};</script>
