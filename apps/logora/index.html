    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"Logora","category":"Lifestyle","desc":"Logora is a minimalist one-tap tracking app for your daily life. Record any repeated activity instantly and let Logora turn your actions into meaningful…","details":"Logora is a minimalist one-tap tracking app for your daily life.\nRecord any repeated activity instantly and let Logora turn your actions into meaningful insights.\n\nWhether you want to track hydration, exercise, caffeine intake, symptoms, habits, or work interruptions — Logora makes it effortless.\nKey Features\n1. One-Tap Counting\nTap an event card to instantly record an action\nHaptic feedback for every interaction\nLong press to add notes or custom values\nUndo support within 60 seconds\n2. Event Management\nFully customizable events (name, icon, SF Symbols, color)\nSet goals and warning thresholds\nPin and reorder frequently used events\n3. History Tracking\nDaily grouped timeline view\nSearch and filter by event type\nEdit, delete, or manually add records\n4. Analytics & Insights\nSummary cards: total, daily average, streaks, trend direction\nCharts: bar chart, line chart, 24-hour distribution\nYearly heatmap (GitHub-style activity view)\n6. Widgets (5 Types)\nHome Screen widgets (small, medium, large)\nLock Screen widgets (circular & rectangular)\nOne-tap logging directly from widgets\n7. Smart Notifications\nGoal completion reminders\nThreshold alerts\nInactivity reminders (custom interval 1–24h)\n8.Data Export\nExport to CSV (detailed or summary format)\nDate range selection\nShare via system share sheet\n9. Privacy First\nFully local data storage\nNo tracking\nNo external servers required","href":"https://apps.apple.com/il/app/logora/id6762621850?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/57/f0/98/57f098f4-d2d1-68d7-9434-e1d1ccdb466f/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4
