    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"PeopleNote","category":"Utilities","desc":"People Note is your personal relationship memory for meetings. Before you walk into a coffee chat, client visit, or family dinner, People Note shows you…","details":"People Note is your personal relationship memory for meetings.\nBefore you walk into a coffee chat, client visit, or family dinner, People Note shows you a simple, focused “cheat sheet” about the people you’re meeting — all stored securely on your device.\n\nRemember people, not just phone numbers\n\nCreate and edit rich contact profiles\n\nAdd avatars, company and job title, phone, email and social accounts\n\nTag contacts as colleagues, clients, friends, family, investors and more\n\nImport from the system Contacts and keep them linked\n\nRelationship “cheat sheet” for every contact\n\nStore the details that actually matter in conversations:\n\nHow you met and who introduced you\n\nFamily info: spouse, kids’ names and ages\n\nPets: name and breed\n\nInterests and favorite topics: sports, hobbies, travel\n\nSensitive or “avoid” topics you don’t want to step on\n\nLinked with your calendar, ready before the meeting\n\nConnect People Note with your device calendar and link events to contacts:\n\nSee which contacts are in each meeting\n\nOpen their relationship card with one tap\n\nGet a local notification before the event with key details:\n“He’s your client’s purchasing director, has two daughters and loves golf. Last time you talked about supply chain digitalization.”\n\nOne-page pre-meeting view\n\nRight before you meet, People Note shows you a clean one-page summary:\n\nBasic info: name, avatar, company, title, relationship tags\n\nPersonal details: family, pets, interests\n\nRecent interactions and notes\n\nFollow-ups and promises from last time\n\nInteraction history, not just call logs\n\nTrack how your relationships grow over time:\n\nLog meetings, calls, messages, emails and more\n\nAdd location, topic, notes and next actions\n\nView a timeline of all interactions with each person\n\nTags, groups and quick search\n\nBuilt-in tags for colleagues, clients, friends and more\n\nCreate your own tags and mark important contacts (A/B/C tier or star)\n\nSearch by name, company, tags and even note content\n\nPrivate by design — data stays on your device\n\nAll data is stored locally in an encrypted database\n\nNo cloud server, no account, no hidden sync\n\n\nEncrypted backup and restore\n\nCreate encrypted backup files with an optional password\n\nBack up all contacts, relationship details and interaction history\n\nShare and restore backup files when you change devices\n\nComing soon\n\n“Today / This week” meeting focus view\n\nRecent contacts and full-text search across all notes\n\nWeekly relationship recap and “it’s been a while” reminders\n\nSimple stats about your network and relationship health\n\nPeople Note is built for people who meet people: sales, consultants, freelancers, founders — and anyone who wants to remember others a little better.","href":"https://apps.apple.com/il/app/peoplenote/id6756147404?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/39/8b/ee/398bee8b-1b57-5075-3772-cd3666ca3033/AppIcon-0-0-1x_U007emarketing-0-11-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/a8/6c/1b/a86c1bf0-6073-3312-1dc3-e1e4c4e59342/Simulator_Screenshot_-_iPhone_17_Pro_Max_-_2025-12-07_at_20.50.03.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/69/4a/d9/694ad967-41f3-9e02-4708-28c010c69150/Simulator_Screenshot_-_iPhone_17_Pro_Max_-_2025-12-07_at_20.47.41.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/42/08/9e/42089e06-4f77-40a1-c620-3efca2d9d854/Simulator_Screenshot_-_iPhone_17_Pro_Max_-_2025-12-07_at_20.51.01.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/af/73/ba/af73baf2-2254-dab2-7491-4ef5a2efb1b4/Simulator_Screenshot_-_iPhone_17_Pro_Max_-_2025-12-07_at_20.46.21.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/8c/ea/fa/8ceafab3-a54c-ac14-c536-6757d344e732/Simulator_Screenshot_-_iPhone_17_Pro_Max_-_2025-12-07_at_20.47.49.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/1f/f2/ec/1ff2ec5f-491f-0e04-c1ef-356ac0c683b5/Simulator_Screenshot_-_iPhone_17_Pro_Max_-_2025-12-07_at_20.48.02.png/320x480bb.jpg"],"slug":"peoplenote"};</script>
