    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"Turkey Runaway","category":"Games","desc":"Run, dodge and attack – using your breath! Turkey Runaway is a fast and hilarious racing game where you blow into the microphone (or make noise) to make…","details":"Run, dodge and attack – using your breath!\n\nTurkey Runaway is a fast and hilarious racing game where you blow into the microphone (or make noise) to make your turkey sprint. Switch lanes, dodge obstacles, and use forks to stun your friends in short, intense races!\n\nBasic Gameplay\n\nBlow into the microphone or make sounds to accelerate\n\nTap the left or right side of the screen to switch lanes\n\nAvoid obstacles and rush to the finish line\n\nHitting obstacles will greatly slow you down\n\nMaster your breathing and timing to keep your turkey at top speed and leave everyone behind!\n\nSingle Player Mode\n\nSingle Player Mode – Pure speed challenge\n\nPure speed challenge\n\nReach the finish line as fast as possible\n\nNo interference and no attacks\n\nPerfect for practicing your breathing rhythm, testing your reaction, and chasing new personal records in short sprint races.\n\n Multiplayer Mode\n\nMultiplayer Mode – Local Bluetooth battle\n\nConnect with nearby players via Bluetooth\n\nBesides sprinting, you can also attack your opponent\n\nTap the fork button at the bottom right to fire a fork\n\nIf your opponent is in the lane you attack, they will be stunned for 2 seconds\n\nWhen you get hit, you will see a “Hit!” notification\n\nSee your opponent’s position and status in real time\n\nRead your rival’s lane, time your fork shots, and turn the race around at the last second!","href":"https://apps.apple.com/il/app/turkey-runaway/id6756235080?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/20/94/3e/20943e8b-542e-e688-0859-f895c5a1ff0f/AppIcon-0-0-1x_U007ephone-0-1-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/d1/63
