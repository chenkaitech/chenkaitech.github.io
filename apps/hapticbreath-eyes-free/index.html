    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"HapticBreath:Eyes-Free","category":"Lifestyle","desc":"HapticBreath is an eyes-free breathing app guided by touch. Instead of watching an animation, listening to a voice, or staring at a timer, simply hold y…","details":"HapticBreath is an eyes-free breathing app guided by touch.\n\nInstead of watching an animation, listening to a voice, or staring at a timer, simply hold your iPhone, close your eyes, and follow the breathing rhythm you can feel.\n\nA rising haptic pattern guides you to inhale.\nA quiet pause helps you hold.\nA fading haptic pattern guides you to exhale.\n\nNo sound. No account. No cloud. No tracking.\n\nHapticBreath is designed for short moments when you want to reset without looking at your screen:\n\n• Before an exam\n• Before a meeting\n• During a study break\n• Before sleep\n• After an emotional moment\n• Anytime you want a quick calm reset\n\nKey Features\n\n• Eyes-free breathing guidance\nFollow breathing patterns through haptics instead of visual animations.\n\n• Distinct inhale and exhale cues\nClear haptic signals help you recognize each phase without looking.\n\n• Multiple breathing modes\nChoose from Quick Calm, Before Exam, Before Meeting, Study Break, After Anger, and Before Sleep.\n\n• Custom breathing patterns\nAdjust inhale, hold, exhale, rest, duration, and haptic strength.\n\n• Silent by default\nUse it in public, in bed, before a meeting, or anywhere you do not want audio.\n\n• Fully local\nYour breathing history and preferences stay on your device.\n\n• Minimal dark interface\nStart a session, put the screen aside, and let touch guide the rhythm.\n\nHapticBreath is not a medical device and does not provide medical advice, diagnosis, or treatment. It is a simple breathing rhythm tool for relaxation, focus, and daily reset moments.","href":"https://apps.apple.com/il/app/hapticbreath-eyes-free/id6790940008?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Pur
