    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"ShareSafeWatermark","category":"Photo & Video","desc":"ShareSafeWatermark is an iOS app built for privacy-first watermarking and anti-misuse sharing of sensitive images. Before sending an ID card, passport,…","details":"ShareSafeWatermark is an iOS app built for privacy-first watermarking and anti-misuse sharing of sensitive images.\n\nBefore sending an ID card, passport, driver’s license, or any document photo to a third party, add a clear watermark and remove hidden metadata (EXIF/GPS/device details) to reduce leakage risks.\n\nWhat you can do\n\nFlexible import\nDocument Scan with automatic perspective correction\nBatch Photos selection (up to 50 images)\nWatermark editor\nSwipe to preview all images in real time\nCustomize text, opacity (0.05–1.0), font size, and color\nLayout modes: Centered or Tiled (harder to crop out)\nDeep privacy cleanup (Metadata)\nRemove EXIF (time, camera parameters)\nRemove GPS location coordinates\nRemove device model/vendor details\nExport & share\nBatch save to Photos with progress\nSystem share sheet (AirDrop, Mail, WeChat, etc.)\nHistory\nAutomatically keeps task history\nReview details and delete old records to free space\n\nPrivacy\nAll processing is done on-device. No server uploads required.\n\nWhat’s New\nAdded batch processing & swipe preview\nAdded EXIF/GPS/device info removal\nPerformance and stability improvements","href":"https://apps.apple.com/il/app/sharesafewatermark/id6760112011?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/0f/27/c2/0f27c2a1-1581-80e4-d6bd-45327b5da001/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/bb/38/b4/bb38b41e-0c28-e6a5-26f5-8d0c909c001d/_U622a_U5c4f_2026-04-07_10.08.01.jpeg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/f3/b6/d4/f3b6d44b-ca35-bb36-868f-f8cf608bf45e/IMG_6742.PNG/320x480bb.jpg","
