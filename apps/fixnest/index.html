    <div id="root"></div><script>window.__CXY_PAGE_APP__={"name":"FixNest","category":"Lifestyle","desc":"Air conditioners, water filters, refrigerators, washing machines, furniture, and renovation projects all have different purchase dates, warranty periods…","details":"Air conditioners, water filters, refrigerators, washing machines, furniture, and renovation projects all have different purchase dates, warranty periods, and maintenance schedules.\n\nFixNest brings your household inventory, warranty information, manuals, maintenance reminders, and repair history together in one organized place.\n\nKeep important information easy to find and give every appliance and household asset a complete service history.\n\nHOUSEHOLD OVERVIEW\n\nSee the condition of your household equipment at a glance:\n\n• View items that are under warranty, expiring soon, or expired\n• Review device totals and status by category\n• Quickly filter the items that need attention\n• See upcoming maintenance reminders\n• Access your latest service and repair records\n\nCOMPLETE DEVICE RECORDS\n\nCreate a detailed profile for every household item:\n\n• Device name, category, brand, and model\n• Purchase date, room, and warranty period\n• Multiple device and service photos\n• Manuals in PDF or image format\n• Built-in categories for appliances, furniture, bathrooms, and renovations\n• Custom categories that you can create and edit\n\nUse FixNest for appliances, water filters, HVAC equipment, furniture, fixtures, windows, renovation work, and more.\n\nWARRANTY AND LIFECYCLE TRACKING\n\nFixNest calculates warranty status from the purchase date and warranty period, helping you identify items that are approaching expiration.\n\nWhen you purchase an extended warranty, you can renew the warranty period while keeping the original purchase information. Retired or replaced equipment can be archived without losing its previous records.\n\nMAINTENANCE AND REPAIR TIMELINE\n\nBuild a complete service history for each item:\n\n• Maintenance, repair, deep cleaning, and routine inspections\n• Service date and technician or service provider\n• Cost, notes, and work details\n• Before-and-after or on-site photos\n• Filters for device category, year, and date range\n• Keyword search across previous records\n\nRecords are displayed in a clear reverse-chronological timeline, making it easy to review previous issues, repairs, and expenses.\n\nSMART MAINTENANCE REMINDERS\n\nCreate reminders for filter cleaning, cartridge replacement, HVAC servicing, inspections, and other recurring tasks:\n\n• Schedule reminders for a specific date\n• Create repeating maintenance intervals\n• Receive scheduled local notifications\n• Mark maintenance as completed\n• Automatically calculate the next due date\n• Postpone reminders when more time is needed\n\nTurn household maintenance into an organized routine instead of something you have to remember.\n\nEXPORT PDF SERVICE REPORTS\n\nGenerate a formatted PDF report from all records or from your current filters.\n\nReports are useful for:\n\n• Home handovers and rental properties\n• Warranty and repair discussions\n• Household inventory documentation\n• Property and renovation records\n• Selling or replacing used equipment\n• Sharing information with family members, technicians, or property managers\n\nReports can be saved, printed, or shared directly from your device.\n\nICLOUD SYNC AND LOCAL BACKUPS\n\nUse iCloud to keep FixNest information up to date across supported Apple devices.\n\nYou can also create local backups and restore your records when moving to another device. Optional incremental backups provide another layer of protection for important household information.\n\nKeep your devices, warranties, manuals, service expenses, and maintenance plans together.\n\nFixNest gives every item in your home a better history.","href":"https://apps.apple.com/il/app/fixnest/id6792494322?uo=4","iconUrl":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/d4/cb/69/d4cb6949-914f-f286-66d2-e1d4bd9d31e6/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/b6/7b/5e/b67b5ebc-16e5-7f29-b432-404f29d16ea1/FixNest-EN.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/b4/b3/d8/b4b3d8a0-b277-7a92-354a-86d645eb1a4c/IMG_6917.PNG/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/04/62/6a/04626a17-4c4c-4a9a-2697-82702450a438/IMG_6920.PNG/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/a1/9c/e6/a19ce6b8-e702-6355-caaa-58d217be4dfe/IMG_6921.PNG/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/df/f1/14/dff11413-11b3-ff07-25f0-aebd8022a8b4/IMG_6923.PNG/320x480bb.jpg"],"slug":"fixnest"};</script>
